# Reports which management clusters of a fleet repository run the Agent
# Platform. See check-agent-platform-topology.sh.
name: "Agent Platform topology"
description: "Report which management clusters of a fleet repository run the Agent Platform"
inputs:
  root:
    description: "Fleet repository root containing management-clusters/"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Install yq
      shell: bash
      run: make bin/yq
    - name: Report topology
      shell: bash
      env:
        YQ: bin/yq
      run: |
        "${GITHUB_ACTION_PATH}/check-agent-platform-topology.sh" "${{ inputs.root }}"

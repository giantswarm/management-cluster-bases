name: Test Agent Platform topology check

on:
  pull_request:
    paths:
      - ".github/actions/agent-platform-topology/**"
      - ".github/workflows/agent-platform-topology-test.yaml"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        run: make bin/yq

      - name: Run the fixtures
        env:
          YQ: bin/yq
        run: .github/actions/agent-platform-topology/run-testdata.sh

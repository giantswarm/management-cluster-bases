name: Test organization kustomizations check

on:
  pull_request:
    paths:
      - '.github/actions/organization-kustomizations/**'
      - '.github/workflows/organization-kustomizations-test.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Test organization kustomizations check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: python3 -m unittest discover -s .github/actions/organization-kustomizations -p 'test_*.py' -v

      - name: Run the action on this repository
        uses: ./.github/actions/organization-kustomizations

name: Report expired silences

on:
  schedule:
    # Everyday at 09:00
    - cron:  '0 9 * * *'
  workflow_dispatch:

jobs:
  silences_report_expired:
    runs-on: ubuntu-latest
    name: Report expired silences
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The report needs the bot branches' remote refs for its
          # --force-with-lease push and the history for each silence's author.
          fetch-depth: 0
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/actions/silences-report-expired
        with:
          directory_pattern: 'bases/silences'
          token: ${{ steps.app-token.outputs.token }}

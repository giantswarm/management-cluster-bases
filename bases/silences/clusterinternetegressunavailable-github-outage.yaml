apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: clusterinternetegressunavailable-github-outage
  namespace: monitoring
  annotations:
    motivation: "GitHub outage: unauthenticated requests to github.com time out, so the egress-github blackbox probe fails on every installation (INC-3469)."
    incident: "https://app.incident.io/gigantic/incidents/3469"
    valid-until: "2026-11-09"
spec:
  matchers:
    - name: alertname
      value: ClusterInternetEgressUnavailable
      matchType: "="
    - name: target
      value: egress-github
      matchType: "="
    - name: cluster_id
      value: ".*"
      matchType: "=~"

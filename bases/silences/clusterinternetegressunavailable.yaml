apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: clusterinternetegressunavailable
  namespace: monitoring
  annotations:
    motivation: "Blackbox egress probes bypass the HTTP proxy on proxy-only installations and fail permanently, while real egress through the proxy works. Silenced until the probes are proxy-aware."
    issue: "https://github.com/giantswarm/giantswarm/issues/38412"
    valid-until: "2026-11-09"
spec:
  matchers:
    - name: alertname
      value: "ClusterInternetEgressUnavailable"
      matchType: "="
    - name: installation
      value: "garm|gerbil|galaxy"
      matchType: "=~"
    - name: cluster_id
      value: ".*"
      matchType: "=~"

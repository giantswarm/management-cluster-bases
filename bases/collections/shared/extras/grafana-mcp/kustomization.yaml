apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - grafana-mcp.yaml
patches:
  - target:
      kind: Konfiguration
      name: collection-konfiguration
      namespace: giantswarm
    patch: '[{"op": "add", "path": "/spec/targets/iterations/grafana-mcp", "value": {"variables": [{"name": "app", "value": "grafana-mcp"}, {"name": "team", "value": "atlas"}]}}]'

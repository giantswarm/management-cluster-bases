---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubescape
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    semver: x.x.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/kubescape
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: kubescape
    namespace: giantswarm
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: kubescape
  # The chart's namespaced resources are wired to the `kubescape` namespace
  # (ksNamespace), so the release is installed and stored there. Storing it in
  # `kubescape` also lets Flux take over the hand-installed releases that exist
  # on some management clusters instead of installing a second copy next to them.
  storageNamespace: kubescape
  targetNamespace: kubescape
  # The kubescape install takes longer than Flux's 5m default (see security-bundle).
  timeout: 15m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: kubescape-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: kubescape-konfiguration
    valuesKey: secret-values.yaml

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: sbom-advisory-operator
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    semver: x.x.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/sbom-advisory-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sbom-advisory-operator
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: sbom-advisory-operator
    namespace: giantswarm
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: sbom-advisory-operator
  # Next to the kubescape SBOMs it reads and the PolicyReports it writes, like the kubescape
  # release itself; the namespace is created on the MCs that do not run kubescape.
  storageNamespace: kubescape
  targetNamespace: kubescape
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: sbom-advisory-operator-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: sbom-advisory-operator-konfiguration
    valuesKey: secret-values.yaml

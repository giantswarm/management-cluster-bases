---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-observability-platform
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    # The values in shared-configs need Grafana jwt auth mode. 0.7.0 is the
    # expected first release with it: v0.6.0 is the latest release, and v0.5.0
    # and v0.6.0 have no jwt mode. Confirm this bound against the actual first
    # jwt release before merge.
    semver: ">=0.7.0"
  url: oci://gsoci.azurecr.io/charts/giantswarm/mcp-observability-platform
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-observability-platform
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-observability-platform
    namespace: giantswarm
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: mcp-observability-platform
  storageNamespace: mcp-observability-platform
  targetNamespace: mcp-observability-platform
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: mcp-observability-platform-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: mcp-observability-platform-konfiguration
    valuesKey: secret-values.yaml

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: plugin-barman-cloud
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    semver: x.x.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/plugin-barman-cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
    namespace: giantswarm
  # The plugin's TLS pair comes from the chart's cert-manager Issuer and
  # Certificates. If they are deleted out of band (a cert-manager CRD
  # reinstall cascades to every Certificate), Helm never recreates them, the
  # orphaned Secret stops renewing, and every CNPG cluster using the plugin
  # stops reconciling once it expires. Drift detection re-applies them.
  driftDetection:
    mode: enabled
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: plugin-barman-cloud
  storageNamespace: giantswarm
  targetNamespace: giantswarm
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: plugin-barman-cloud-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: plugin-barman-cloud-konfiguration
    valuesKey: secret-values.yaml

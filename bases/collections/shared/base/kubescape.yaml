---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubescape
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    semver: x.x.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/kubescape
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: kubescape
    namespace: giantswarm
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: kubescape
  storageNamespace: kubescape
  targetNamespace: kubescape
  # Kubescape upgrades are slow: the node-agent DaemonSet updates one node at a
  # time. A timed-out upgrade is rolled back, and an older kubescape cannot read
  # storage that a newer one has already migrated. security-bundle allows 30m
  # for the same reason.
  timeout: 30m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: kubescape-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: kubescape-konfiguration
    valuesKey: secret-values.yaml

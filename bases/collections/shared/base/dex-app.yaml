---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dex-app
  namespace: giantswarm
  labels:
    app.kubernetes.io/name: dex-app
spec:
  interval: 10m
  provider: generic
  ref:
    tag: 2.2.3
  url: oci://gsoci.azurecr.io/charts/giantswarm/dex-app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex-app
  namespace: giantswarm
  labels:
    app.kubernetes.io/name: dex-app
spec:
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: dex-app
  storageNamespace: giantswarm
  targetNamespace: giantswarm
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: dex-app-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: dex-app-default-dex-config
    valuesKey: default
  - kind: Secret
    name: dex-app-konfiguration
    valuesKey: secret-values.yaml
  chartRef:
    kind: OCIRepository
    name: dex-app
    namespace: giantswarm

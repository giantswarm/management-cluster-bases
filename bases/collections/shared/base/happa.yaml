---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: happa
  namespace: giantswarm
spec:
  interval: 10m
  provider: generic
  ref:
    semver: x.x.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/happa
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: happa
  namespace: giantswarm
spec:
  chartRef:
    kind: OCIRepository
    name: happa
    namespace: giantswarm
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  # The happa web UI is off on every installation. The release stays for the
  # happaapi HTTPRoute, BackendTLSPolicy and SecurityPolicy: the management
  # cluster API endpoint Backstage's Kubernetes plugin reads.
  postRenderers:
  - kustomize:
      patches:
      - target:
          name: happa|happa-configmap|happa-network-policy|happa-psp
        patch: |
          $patch: delete
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: happa
  releaseName: happa
  storageNamespace: giantswarm
  targetNamespace: giantswarm
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: happa-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: happa-konfiguration
    valuesKey: secret-values.yaml

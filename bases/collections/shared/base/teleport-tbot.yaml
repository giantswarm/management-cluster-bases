---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: teleport-tbot
  namespace: giantswarm
  labels:
    app.kubernetes.io/name: teleport-tbot
spec:
  interval: 10m
  provider: generic
  ref:
    tag: 0.4.1
  url: oci://gsoci.azurecr.io/charts/giantswarm/teleport-tbot
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-tbot
  namespace: giantswarm
  labels:
    app.kubernetes.io/name: teleport-tbot
spec:
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: teleport-tbot
  storageNamespace: giantswarm
  targetNamespace: giantswarm
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: teleport-tbot-registered-clusters
    valuesKey: values
    optional: true
  - kind: ConfigMap
    name: teleport-tbot-konfiguration
    valuesKey: configmap-values.yaml
  - kind: Secret
    name: teleport-tbot-konfiguration
    valuesKey: secret-values.yaml
  chartRef:
    kind: OCIRepository
    name: teleport-tbot
    namespace: giantswarm

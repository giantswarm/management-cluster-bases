# Applied after ../../base below, so the shared testing-stage patches reach
# every OCIRepository in this collection.
components:
  - ../../../shared/stages/testing
patches:
  - target:
      kind: Konfiguration
      name: kamaji-addons-collection-konfiguration
      namespace: giantswarm
    patch: '[{"op": "add", "path": "/spec/targets/defaults/variables/-", "value": {"name": "stage", "value": "testing"}}]'
resources:
  - ../../base

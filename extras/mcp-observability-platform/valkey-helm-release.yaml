apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-observability-platform-valkey
  namespace: flux-giantswarm
  labels:
    application.giantswarm.io/team: atlas
spec:
  releaseName: mcp-observability-platform-valkey
  chartRef:
    kind: OCIRepository
    name: mcp-observability-platform-valkey
    namespace: flux-giantswarm
  install:
    remediation:
      retries: 10
      remediateLastFailure: false
  interval: 10m
  targetNamespace: mcp-observability-platform
  timeout: 10m
  upgrade:
    remediation:
      retries: 10
      remediateLastFailure: false
  values:
    # Valkey standalone mode for the OAuth token store of mcp-observability-platform
    valkey:
      auth:
        enabled: true
        usersExistingSecret: "mcp-observability-platform-valkey-auth"
        aclUsers:
          default:
            permissions: "~* &* +@all"
            # The chart reads the password under key "password"
            # (oauth.storage.valkey.existingSecret).
            passwordKey: "password"
      architecture: standalone
      podSecurityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      deploymentStrategy: Recreate
      dataStorage:
        enabled: true
        requestedSize: "1Gi"
        keepPvc: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
      metrics:
        enabled: true
        exporter:
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
        podMonitor:
          enabled: true
          additionalLabels:
            application.giantswarm.io/team: atlas
    ciliumNetworkPolicy:
      enabled: true

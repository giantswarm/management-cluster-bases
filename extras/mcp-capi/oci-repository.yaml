apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-capi
  namespace: flux-giantswarm
  labels:
    application.giantswarm.io/team: bumblebee
spec:
  interval: 1m
  url: oci://gsoci.azurecr.io/charts/giantswarm/mcp-capi
  ref:
    # Capped at the newest stable the fleet runs: a new stable reaches the test
    # installations first, through the OCIRepository patch in their
    # extras/kustomization.yaml that follows every newer stable, and the
    # rest of the fleet once this cap is raised after it ran there.
    semver: "<=0.5.41"
  provider: generic

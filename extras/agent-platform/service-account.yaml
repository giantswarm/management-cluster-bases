---
# Handover to the chart (management-cluster-bases#727): the agent-platform-connectivity
# chart renders this ServiceAccount and RoleBinding itself (agent-platform#282, from
# kagent.fluxServiceAccountName) and adopts these objects on its upgrade. The prune
# annotation makes kustomize-controller leave the live objects alone when this file is
# removed in the next step, so the chart keeps owning them where kagent runs and the
# agents' HelmReleases never lose their identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-flux
  namespace: kagent
  labels:
    application.giantswarm.io/team: bumblebee
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Namespace-scoped admin: a RoleBinding to the built-in cluster-admin ClusterRole
# grants full control of ALL resources (including custom resources) within the
# kagent namespace only. Used by Flux (spec.serviceAccountName: kagent-flux) to
# deploy additional agent-platform HelmReleases into this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagent-flux
  namespace: kagent
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kagent-flux
    namespace: kagent

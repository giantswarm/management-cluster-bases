apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-platform
  namespace: flux-giantswarm
  labels:
    # Owning team for Flux-failure alert routing and Backstage catalog ownership.
    # The umbrella HelmRelease is created by this base (not rendered by the chart),
    # so the chart's labels.common helper never stamps it — set it explicitly here.
    application.giantswarm.io/team: bumblebee
spec:
  # Explicitly set release name to avoid Flux generating a prefixed name
  # when targetNamespace differs from HelmRelease namespace
  releaseName: agent-platform
  # CRDs are app-owned: each component ships its own crds/ and the meta-package
  # sets crds: CreateReplace per component (chart >=1.10.0). CR-before-CRD
  # ordering is handled inside each child release (connectivity/mcps dependsOn
  # the CRD-owning component), so the meta-package needs no CRD-bundle dependsOn.
  chartRef:
    kind: OCIRepository
    name: agent-platform
    namespace: flux-giantswarm
  install:
    # The meta chart's own crds/ are the bundled Flux engine's (flux-engine subchart: the Flux and
    # Flux Operator CRDs), which is off on management clusters (components.flux.enabled: false below).
    # helm-controller applies a chart's crds/ BEFORE it renders the templates, so Skip guards the
    # cluster's own Flux CRDs even if that value were ever flipped: nothing in the meta chart's crds/
    # may touch this cluster. Component CRDs are unaffected — they live in the child HelmReleases
    # the chart renders, each with its own crds: CreateReplace.
    crds: Skip
    remediation:
      retries: 10
      remediateLastFailure: false
  interval: 10m
  targetNamespace: agent-platform
  # Bound: 12m or more (helm-controller's default is 5m). The install is Helm's --wait, which
  # returns when every component HelmRelease is Ready; with kagent on, the first 4.x reconcile
  # (kagent API v2, giantswarm/giantswarm#37705) installs nine component HelmReleases plus Substrate
  # and kagent in dependency order — about 5–6 minutes through the cluster's own Flux (≈220 s of
  # --wait for the components, then Substrate and kagent readiness), measured by the ATS own-Flux
  # scenario of giantswarm/agent-platform#380 (tests/ats/test_own_flux.py sets 12m). A HelmRelease
  # on the default fails its first 4.x reconcile on the timeout. A per-installation cut-over
  # patch never lowers this value.
  timeout: 20m
  upgrade:
    # Same as install.crds: the meta chart's crds/ are the engine's, never applied here.
    crds: Skip
    remediation:
      retries: 10
      remediateLastFailure: false
  # GitOps topology for the meta-package. The chart renders each
  # component as its own OCIRepository + HelmRelease. Create those Flux objects in
  # flux-giantswarm (exempt from the flux-multi-tenancy Kyverno policy, which would
  # otherwise reject child HelmReleases for missing serviceAccountName) and route
  # the workloads to the agent-platform namespace. Each component owns its CRDs
  # (crds: CreateReplace); there is no separate CRD bundle to delegate to.
  values:
    gitops:
      namespace: flux-giantswarm
      targetNamespace: agent-platform
    components:
      flux:
        # The chart's bundled Flux engine (conditional flux-engine subchart, default on) must stay
        # off on management clusters: they run their own Flux and install this chart through it, and
        # helm-controller's default install.crds: Create would force-apply the chart's Flux CRDs over
        # the cluster's own. Set before the chart release that carries the engine (roadmap#4348).
        enabled: false
  valuesFrom:
    # ConfigMap rendered by Konfiguration from shared-configs template.
    # NOTE: requires a matching `agent-platform` template in giantswarm-config
    # that renders values under the umbrella's `muster:` subchart prefix
    # (e.g. muster.muster.oauth.server.baseUrl, not oauth.server.baseUrl).
    - kind: ConfigMap
      name: agent-platform-konfiguration
      valuesKey: configmap-values.yaml
    # Secret rendered by Konfiguration from the shared-configs secret-values template.
    # Per-cluster overrides (e.g. kagent.providers.anthropic.apiKey) are
    # SOPS-encrypted in giantswarm-configs under installations/<cluster>/apps/agent-platform/.
    # optional: true so clusters without a secret override still reconcile.
    - kind: Secret
      name: agent-platform-konfiguration
      valuesKey: secret-values.yaml
      optional: true

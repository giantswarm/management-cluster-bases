apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: marge
  namespace: flux-giantswarm
  labels:
    application.giantswarm.io/team: bumblebee
spec:
  releaseName: marge
  chartRef:
    kind: OCIRepository
    name: marge
    namespace: flux-giantswarm
  install:
    remediation:
      retries: 10
      remediateLastFailure: false
  interval: 10m
  targetNamespace: marge
  timeout: 10m
  upgrade:
    remediation:
      retries: 10
      remediateLastFailure: false

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: OCIRepository
    patch: |-
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: stable-testing
      spec:
        ref:
          tag: null
          semver: ">=0.0.0"
          semverFilter: '^[0-9]+\.[0-9]+\.[0-9]+$'

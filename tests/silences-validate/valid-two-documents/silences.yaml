apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: first-silence
  namespace: monitoring
  annotations:
    valid-until: "2099-01-01"
spec:
  matchers:
    - name: alertname
      value: "FirstAlert"
      matchType: "="
    - name: cluster_id
      value: "test"
      matchType: "="

apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: valid-silence
  namespace: monitoring
  annotations:
    valid-until: "2099-01-01"
spec:
  matchers:
    - name: alertname
      value: "FirstAlert"
      matchType: "="
    - name: cluster_id
      value: "test"
      matchType: "="
---
apiVersion: observability.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: invalid-silence
  namespace: monitoring
  annotations:
    valid-until: "not-a-date"
spec:
  matchers:
    - name: alertname
      value: "SecondAlert"
      matchType: "="
